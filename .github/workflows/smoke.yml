# The smoke test, on every push and pull request: the README's headless-
# verification promise held by a machine. See test/smoke.js for what it checks.
name: smoke
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node test/smoke.js
